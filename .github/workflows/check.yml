name: Browser regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: qa-testing-portfolio
      - uses: actions/checkout@v4
        with:
          repository: onlysahiflisupit/it-helpdesk-demo
          path: it-helpdesk-demo
      - uses: actions/checkout@v4
        with:
          repository: onlysahiflisupit/course-management-demo
          path: course-management-demo
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: qa-testing-portfolio
      - run: npx playwright install --with-deps chromium
        working-directory: qa-testing-portfolio
      - run: npm test
        working-directory: qa-testing-portfolio
